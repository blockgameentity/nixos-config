[animate]
close_animation = fade
duration = 200ms circle
enabled_for = (type equals "toplevel" | (type equals "x-or" & focusable equals true))
fade_duration = 400ms circle
fade_enabled_for = type equals "overlay"
fire_color = \#B22303FF
fire_duration = 300ms linear
fire_enabled_for = none
fire_particle_size = 16.000000
fire_particles = 2000
minimize_animation = squeezimize
open_animation = zoom
random_fire_color = false
spin_duration = 250ms linear
spin_rotations = 1
squeezimize_duration = 150ms linear
startup_duration = 600ms linear
zap_duration = 250ms linear
zoom_duration = 500ms circle
zoom_enabled_for = none

[autostart]
# xdg-desktop-portal's unit carries `Requisite=graphical-session.target`, and
# nothing in a Wayfire session starts that target (GNOME, KDE, sway and Hyprland
# each do it themselves). Without it every portal activation dies with "start
# failed with result 'dependency'": no Settings portal, no screencast, and GTK
# apps logging "Gdk cannot get portal org.freedesktop.portal.settings".
# graphical-session.target itself refuses `systemctl start` (RefuseManualStart),
# so this starts wayfire-session.target (home/wayfire.nix), which BindsTo it.
# It is chained after the environment import on purpose: the portal backends'
# `ConditionEnvironment=WAYLAND_DISPLAY` needs that to have landed first, and
# separate [autostart] entries run concurrently.
0_env = dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XAUTHORITY WAYFIRE_SOCKET XDG_CURRENT_DESKTOP=wayfire && systemctl --user start wayfire-session.target
xdp = sleep 1 && systemctl --user restart xdg-desktop-portal xdg-desktop-portal-wlr
autostart_wf_shell = false
polkit = polkit-gnome-agent
bluetooth = blueman-applet
# Split MIME filters keep both text and copied screenshots/images in history.
clipboard_text = wl-paste --type text --watch cliphist store
clipboard_image = wl-paste --type image --watch cliphist store
gamma = wlsunset
# swayidle differs per machine (the laptop blanks every output and hibernates on
# battery; the desktop only blanks the OLED), so its arguments live in idle.sh.
idle = ~/.config/wayfire-scripts/idle.sh
network = nm-applet
notifications = swaync
osd = swayosd-server
# outputs.sh must finish (NVIDIA DSC head staging) before the bar exists, else
# ironbar sees DP-3/HDMI-A-2 appear and disappear while it is starting up.
# NixOS: the bar comes from nixpkgs on PATH. nixpkgs 0.19.x names it `ironbar`;
# 0.20+ split the daemon out as `ironbard` - keep this in sync with whichever
# version modules/wayfire.nix ends up installing.
panel = sh -c 'timeout 30 ~/.config/wayfire-scripts/outputs.sh; exec ironbar'
wallpaper = ~/.config/wayfire-scripts/wallpaper.sh
slideshow = ~/.config/wayfire-scripts/slideshow.sh
launcher = walker --gapplication-service

# Left: Acer KG251Q on DP (144 Hz max). Connector names below are this install's; see
# outputs.sh, which finds the monitors by serial instead.
[output:DP-3]
mode = 1920x1080@143981
position = 0,0
transform = normal
scale = 1.000000
vrr = false

[output:DP-2]
# Safe bootstrap mode. outputs.sh stages the NVIDIA DSC allocation and then
# switches this OLED to 3440x1440@239984 after Wayfire starts.
mode = 3440x1440@164900
position = 1920,0
transform = normal
scale = 1.000000
# VRR off on every output, by decision: it is never used, and on this OLED
# (AW3425DW) adaptive sync causes gamma/brightness flicker as the refresh rate
# swings. outputs.sh's wlr-randr calls do not pass --adaptive-sync, so this
# survives the DSC re-staging.
vrr = false

# Right: Acer KG251Q on HDMI (240 Hz, no 144 Hz mode), portrait.
[output:HDMI-A-2]
mode = 1920x1080@239760
position = 5360,0
transform = 270
scale = 1.000000
vrr = false

[command]
binding_clipboard = <super> KEY_V
binding_colorpicker = <super> <shift> KEY_C
binding_files = <super> KEY_E
binding_launcher = <super> KEY_X
binding_lock = <super> KEY_L
binding_logout = <super> KEY_ESC
binding_mute = KEY_MUTE
binding_notifications = <super> KEY_N
# PrtSc reaches the kernel as KEY_SYSRQ on most keyboards; some laptop keyboards
# send KEY_PRINT instead, so both are bound. (This used to be KEY_PAGEUP.)
binding_screenshot = KEY_SYSRQ | KEY_PRINT
binding_screenshot_full = <shift> KEY_SYSRQ | <shift> KEY_PRINT
binding_screenshot_edit = <ctrl> KEY_SYSRQ | <ctrl> KEY_PRINT
binding_system = <super> KEY_P
binding_terminal = <super> KEY_ENTER
command_clipboard = ~/.config/wayfire-scripts/clipboard.sh
command_colorpicker = hyprpicker -a
command_files = dolphin
command_launcher = walker
command_light_down = brightnessctl set 5%-
command_light_up = brightnessctl set +5%
command_lock = swaylock -f -c 000000
command_logout = wlogout
command_mute = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && swayosd-client --output-volume mute-toggle
command_notifications = swaync-client -t
command_screenshot = ~/.config/wayfire-scripts/screenshot.sh region
command_screenshot_full = ~/.config/wayfire-scripts/screenshot.sh full
command_screenshot_edit = ~/.config/wayfire-scripts/screenshot.sh edit
command_system = missioncenter
command_terminal = ghostty
command_volume_down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && swayosd-client --output-volume lower
command_volume_up = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && swayosd-client --output-volume raise
repeatable_binding_light_down = KEY_BRIGHTNESSDOWN
repeatable_binding_light_up = KEY_BRIGHTNESSUP
repeatable_binding_volume_down = KEY_VOLUMEDOWN
repeatable_binding_volume_up = KEY_VOLUMEUP

[core]
background_color = \#1A1A1AFF
close_top_view = <super> KEY_Q | <alt> KEY_F4
exit = <alt> <ctrl> KEY_BACKSPACE
focus_button_with_modifiers = false
focus_buttons = BTN_LEFT | BTN_MIDDLE | BTN_RIGHT
focus_buttons_passthrough = true
max_render_time = -1
# NOTE: 'workarounds' is not a plugin in wayfire 0.11 - its options are
# registered by core. Listing it made wayfire log a plugin-load error at every
# startup. Same for the previous missing entries: xdg-activation and
# preserve-output are real plugins that simply were not enabled.
# NixOS: winshadows, focus-request and focus-steal-prevent are NOT part of wayfire
# itself - they come from the separate wayfire-plugins-extra tree (upstream
# v0.11.2 exists; see docs/wayfire.md "Still outstanding"). Dropped here rather
# than logging three failed plugin loads on every start. Note they were also
# suspect on CachyOS: the distro package is wayfire-plugins-extra 0.10.0, built
# against a 0.11 core.
plugins = animate autostart command decoration expo fast-switcher foreign-toplevel grid gtk-shell idle move oswitch place preserve-output resize session-lock  shortcuts-inhibit switcher vswitch window-rules wm-actions xdg-activation
preferred_decoration_mode = client
transaction_timeout = 100
vheight = 3
vwidth = 3
xwayland = true
xwayland_startup_script = 

[decoration]
active_color = \#222222AA
border_size = 4
button_order = minimize maximize close
font = sans-serif
font_color = \#FFFFFFFF
forced_views = none
ignore_views = none
inactive_color = \#333333DD
title_height = 30

[expo]
background = \#1A1A1AFF
duration = 300ms circle
inactive_brightness = 0.700000
keyboard_interaction = true
offset = 10
toggle = <super> KEY_W
transition_length = 200

[fast-switcher]
activate = <alt> KEY_ESC
activate_backward = <alt> <shift> KEY_ESC
inactive_alpha = 0.700000

[foreign-toplevel]

[grid]
duration = 300ms circle
restore = <super> KEY_DOWN
slot_b = <super> KEY_KP2
slot_bl = <super> KEY_KP1
slot_br = <super> KEY_KP3
slot_c = <super> KEY_UP | <super> KEY_KP5
slot_l = <super> KEY_LEFT
slot_r = <super> KEY_RIGHT
slot_t = 
slot_tl = <super> KEY_KP7
slot_tr = <super> KEY_KP9
