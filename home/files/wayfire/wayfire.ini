# Laptop internal panel only; the desktop has no eDP output, so these blocks do
# nothing there. 1.25 = 125%, 1.50 = 150%. Wayfire applies this through
# wp_fractional_scale_v1, so Wayland-native GTK/Qt apps render crisply while
