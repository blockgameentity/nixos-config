[input]
3fg_drag = default
click_method = default
cursor_size = 24
# Must name an installed theme. "default" does not exist on NixOS, so Wayfire
# fell back to wlroots' built-in bitmap cursor, which has one size and ignores
# output scale (tiny pointer at 125%). Adwaita matches XCURSOR_THEME, SDDM and
# home.pointerCursor, and ships sizes for fractional scales.
cursor_theme = Adwaita
disable_touchpad_while_mouse = false
disable_touchpad_while_typing = false
drag_lock = false
gesture_sensitivity = 1.000000
kb_capslock_default_state = false
kb_numlock_default_state = false
kb_repeat_delay = 400
kb_repeat_rate = 40
left_handed_mode = false
middle_emulation = false
modifier_binding_timeout = 400
mouse_accel_profile = default
mouse_cursor_speed = 0.000000
mouse_natural_scroll = false
mouse_scroll_speed = 1.000000
natural_scroll = false
scroll_method = default
tablet_motion_mode = default
tap_and_drag = true
tap_to_click = true
touchpad_accel_profile = default
touchpad_cursor_speed = 0.000000
touchpad_scroll_speed = 1.000000
xkb_layout = dk
xkb_model = 
xkb_options = 
xkb_rules = evdev
xkb_variant = 

[input-device]
calibration = 
output = 

[input-method-v1]
