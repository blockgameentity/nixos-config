[autostart]
# xdg-desktop-portal's unit carries `Requisite=graphical-session.target`, and
# nothing in a Wayfire session starts that target (GNOME, KDE, sway and Hyprland
# each do it themselves). Without it every portal activation dies with "start
# failed with result 'dependency'": no Settings portal, no screencast, and GTK
# apps logging "Gdk cannot get portal org.freedesktop.portal.settings".
# graphical-session.target itself refuses `systemctl start` (RefuseManualStart),
# so this starts wayfire-session.target (home/wayfire.nix), which BindsTo it.
# It is chained after the environment import on purpose: the portal backends'
# `ConditionEnvironment=WAYLAND_DISPLAY` needs that to have landed first, and
# separate [autostart] entries run concurrently.
0_env = dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XAUTHORITY WAYFIRE_SOCKET XDG_CURRENT_DESKTOP=wayfire && systemctl --user start wayfire-session.target
xdp = sleep 1 && systemctl --user restart xdg-desktop-portal xdg-desktop-portal-wlr
autostart_wf_shell = false
polkit = polkit-gnome-agent
bluetooth = blueman-applet
clipboard = wl-paste --watch cliphist store
gamma = wlsunset
idle = swayidle -w \
    timeout 500 'swaylock -f -c 000000' \
    timeout 300 'wlopm --off DP-2' \
    resume 'wlopm --on DP-2'
network = nm-applet
notifications = swaync
osd = swayosd-server
# outputs.sh must finish (NVIDIA DSC head staging) before the bar exists, else
# ironbar sees HDMI-A-2/DP-3 appear and disappear while it is starting up.
# NixOS: the bar comes from nixpkgs on PATH. nixpkgs 0.19.x names it `ironbar`;
# 0.20+ split the daemon out as `ironbard` - keep this in sync with whichever
# version modules/wayfire.nix ends up installing.
panel = sh -c 'timeout 30 ~/.config/wayfire-scripts/outputs.sh; exec ironbar'
wallpaper = ~/.config/wayfire-scripts/wallpaper.sh
slideshow = ~/.config/wayfire-scripts/slideshow.sh
launcher = walker --gapplication-service

# Left: Acer KG251Q (240 Hz). Connector names below are this install's; see
# outputs.sh, which finds the monitors by serial instead.
[output:HDMI-A-2]
mode = 1920x1080@239760
position = 0,0
transform = normal
scale = 1.000000
vrr = false

[output:DP-2]
# Safe bootstrap mode. outputs.sh stages the NVIDIA DSC allocation and then
# switches this OLED to 3440x1440@239984 after Wayfire starts.
mode = 3440x1440@164900
position = 1920,0
transform = normal
scale = 1.000000
# VRR off on every output, by decision: it is never used, and on this OLED
# (AW3425DW) adaptive sync causes gamma/brightness flicker as the refresh rate
# swings. outputs.sh's wlr-randr calls do not pass --adaptive-sync, so this
# survives the DSC re-staging.
vrr = false

# Right: Acer KG251Q (144 Hz), portrait.
[output:DP-3]
mode = 1920x1080@143981
position = 5360,0
transform = 270
scale = 1.000000
vrr = false

[bench]
average_frames = 25
position = top_center

[blur]
# The PR #3171 fix (broken blur on 90/270 outputs) is now built in
# (packages/wayfire.nix), so blur is back on. Only layer-shell panels are
# blurred: "panel" is the view type of every top-layer surface, i.e. ironbar and
# its popups, which draw a translucent background (ironbar/style.css) for this.
# Use (type is "toplevel") | (type is "panel") to also blur translucent windows.
blur_by_default = type is "panel"
bokeh_degrade = 1
bokeh_iterations = 15
bokeh_offset = 5.000000
box_degrade = 1
box_iterations = 2
box_offset = 1.000000
gaussian_degrade = 1
gaussian_iterations = 2
gaussian_offset = 1.000000
kawase_degrade = 3
kawase_iterations = 2
kawase_offset = 1.700000
method = kawase
saturation = 1.000000
toggle = none

