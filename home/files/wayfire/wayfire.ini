enable_text_input_v3 = true

[move]
activate = <super> BTN_LEFT
enable_snap = true
enable_snap_off = true
join_views = false
preview_base_border = \#404080CC
preview_base_color = \#8080FF80
preview_border_width = 3
quarter_snap_threshold = 50
snap_off_threshold = 10
snap_threshold = 10
workspace_switch_after = -1

[oswitch]
above_output = 
below_output = 
left_output = 
next_output = <super> KEY_O
next_output_with_win = <shift> <super> KEY_O
prev_output = 
prev_output_with_win = 
right_output = 

[output]
depth = 8
icc_profile = 
mode = auto
position = auto
scale = 1.000000
transform = normal
vrr = false

[output:eDP-1]
# Laptop internal panel only; the desktop has no eDP output, so these blocks do
# nothing there. 1.25 = 125%, 1.50 = 150%. Wayfire applies this through
# wp_fractional_scale_v1, so Wayland-native GTK/Qt apps render crisply while
# XWayland clients fall back to the nearest integer scale.
#
# The panel is normally eDP-2, not eDP-1: connector numbers are global across
# GPUs, and the RTX 3060's (unconnected) eDP connector registers first. Which
# one wins depends on driver load order, so both names carry the same settings.
mode = auto
scale = 1.250000
vrr = false

[output:eDP-2]
mode = auto
scale = 1.250000
vrr = false

[place]
mode = center

[preserve-output]
last_output_focus_timeout = 10000

[resize]
