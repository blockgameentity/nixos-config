# ============================================================
# ironbar 0.19 - every key here is checked against the 0.19.1 docs/source
# (docs/Configuration guide.md, docs/modules/*.md).
#
# Look: one full-width, translucent bar (Wayfire blurs what is behind it, see
# [blur] in wayfire.ini) with the modules grouped into rounded "pills". All
# glyphs are Material Design icons from JetBrainsMono Nerd Font Propo, one size
# and one colour, so nothing mixes icon styles; see style.css.
#
# Notes:
# - `icon_theme` is a top-level key only; a copy inside [monitors.X] is ignored.
# - `launch_command` is a per-module option (launcher/menu) whose default is
#   already `gtk-launch {app_name}`; gtk-launch comes from gtk3 in
#   modules/wayfire.nix.
# - No workspaces module: ironbar 0.19 supports it on Sway/Hyprland/Niri only,
#   on Wayfire it renders nothing.
# ============================================================
icon_theme = "Adwaita"

position = "top"
height = 34
popup_gap = 6

[[start]]
type = "menu"
label = ""
app_icon_size = 20

[[start]]
type = "launcher"
favorites = ["firefox"]
icon_size = 20

[start.truncate_popup]
mode = "middle"
max_length = 40

[[start]]
type = "music"
player_type = "mpris"
format = "{title} · {artist}"

[start.truncate]
mode = "end"
max_length = 40

[[center]]
type = "clock"
format = "%a %d/%m  %H:%M"
format_popup = "%H:%M:%S"

[[end]]
type = "sys_info"
format = [
    "󰓅 {cpu_percent}%",
    "󰍛 {memory_percent}%",
]

[end.interval]
cpu = 2
memory = 5

[[end]]
type = "volume"
format = "{icon} {percentage}%"
mute_format = "{icon} {percentage}%"
show_sources = true

[end.icons]
mic_volume = "󰍬"
mic_muted = "󰍭"

[[end]]
type = "battery"
show_if = "ls /sys/class/power_supply/ | grep --quiet '^BAT'"
icon_size = 16

[[end]]
type = "clipboard"
max_items = 8
icon_size = 16

[end.truncate]
mode = "end"
length = 40

[[end]]
type = "tray"
icon_size = 16

[[end]]
type = "notifications"
show_count = true

[[end]]
type = "custom"
name = "power-menu"
class = "power-menu"

[[end.bar]]
type = "button"
name = "power-btn"
label = "󰐥"
on_click = "popup:toggle"

[[end.popup]]
type = "box"
orientation = "vertical"

[[end.popup.widgets]]
type = "label"
name = "header"
label = "Power"

[[end.popup.widgets]]
type = "box"
name = "buttons"

[[end.popup.widgets.widgets]]
type = "button"
class = "power-btn"
label = "󰌾"
on_click = "!swaylock -f -c 000000"

[[end.popup.widgets.widgets]]
type = "button"
class = "power-btn"
# systemctl suspend hibernates on the laptop (SuspendState=disk).
label = "󰤄"
on_click = "!systemctl suspend"

[[end.popup.widgets.widgets]]
type = "button"
class = "power-btn"
label = "󰜉"
on_click = "!systemctl reboot"

[[end.popup.widgets.widgets]]
type = "button"
class = "power-btn danger"
label = "󰐥"
on_click = "!systemctl poweroff"

# ============================================================
# Dell AW3425DW OLED ultrawide (DP-2): same bar, but it auto-hides after 2 s
# without the pointer, for burn-in protection. Scroll on the top edge to reveal
# it; just passing the pointer over the edge does not. `autohide_listener` comes
# from patches/ironbar-autohide-reveal-on-scroll.patch (upstream PR #1537).
# ============================================================
[monitors.DP-2]
position = "top"
height = 34
popup_gap = 6
autohide = 2000
autohide_listener = "scroll"

[[monitors.DP-2.start]]
type = "menu"
label = ""
app_icon_size = 20

[[monitors.DP-2.start]]
type = "launcher"
favorites = ["firefox"]
icon_size = 20

[monitors.DP-2.start.truncate_popup]
mode = "middle"
max_length = 40

[[monitors.DP-2.start]]
type = "music"
player_type = "mpris"
format = "{title} · {artist}"

[monitors.DP-2.start.truncate]
mode = "end"
max_length = 40

[[monitors.DP-2.center]]
type = "clock"
format = "%a %d/%m  %H:%M"
format_popup = "%H:%M:%S"

[[monitors.DP-2.end]]
type = "sys_info"
format = [
    "󰓅 {cpu_percent}%",
    "󰍛 {memory_percent}%",
]

[monitors.DP-2.end.interval]
cpu = 2
memory = 5

[[monitors.DP-2.end]]
type = "volume"
format = "{icon} {percentage}%"
mute_format = "{icon} {percentage}%"
show_sources = true

[monitors.DP-2.end.icons]
mic_volume = "󰍬"
mic_muted = "󰍭"

[[monitors.DP-2.end]]
type = "clipboard"
max_items = 8
icon_size = 16

[monitors.DP-2.end.truncate]
mode = "end"
length = 40

[[monitors.DP-2.end]]
type = "tray"
icon_size = 16

[[monitors.DP-2.end]]
type = "notifications"
show_count = true

[[monitors.DP-2.end]]
type = "custom"
name = "power-menu"
class = "power-menu"

[[monitors.DP-2.end.bar]]
type = "button"
name = "power-btn"
label = "󰐥"
on_click = "popup:toggle"

[[monitors.DP-2.end.popup]]
type = "box"
orientation = "vertical"

[[monitors.DP-2.end.popup.widgets]]
type = "label"
name = "header"
label = "Power"

[[monitors.DP-2.end.popup.widgets]]
type = "box"
name = "buttons"

[[monitors.DP-2.end.popup.widgets.widgets]]
type = "button"
class = "power-btn"
label = "󰌾"
on_click = "!swaylock -f -c 000000"

[[monitors.DP-2.end.popup.widgets.widgets]]
type = "button"
class = "power-btn"
label = "󰤄"
on_click = "!systemctl suspend"

[[monitors.DP-2.end.popup.widgets.widgets]]
type = "button"
class = "power-btn"
label = "󰜉"
on_click = "!systemctl reboot"

[[monitors.DP-2.end.popup.widgets.widgets]]
type = "button"
class = "power-btn danger"
label = "󰐥"
on_click = "!systemctl poweroff"
