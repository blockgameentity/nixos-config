# ============================================================
# Default permanent top bar for non-OLED monitors.
# Currently applies to DP-2 and portrait HDMI-A-1.
# ============================================================
position = "top"
icon_theme = "Adwaita"

# ironbar 0.19 launches both the launcher widget and the menu widget through this
# command, and its default is `gtk-launch {app_name}` - a binary nixpkgs does not
# put on PATH unless gtk3 is in systemPackages. It is (modules/wayfire.nix), and
# the command is spelled out here so the dependency stays visible: with no
# `gtk-launch`, clicking an entry in the bar does nothing at all.
[launcher]
launch_command = "gtk-launch {app_name}"

[[start]]
type = "menu"
label = "󱓞"

[[start]]
type = "workspaces"

[[start]]
type = "launcher"
favorites = ["firefox"]

[start.truncate]
mode = "end"
max_length = 30

[[center]]
type = "music"
player_type = "mpris"

[[end]]
type = "battery"
show_if = "ls /sys/class/power_supply/ | grep --quiet '^BAT'"

[[end]]
type = "sys_info"
format = [
    "{cpu_percent}% ",
    "{memory_percent}% ",
]

[end.interval]
cpu = 1

[[end]]
type = "clipboard"
max_items = 5

[end.truncate]
mode = "end"
length = 30

[[end]]
type = "volume"

[[end]]
type = "custom"
name = "power-menu"
class = "power-menu"

[[end.bar]]
type = "button"
name = "power-btn"
label = ""
on_click = "popup:toggle"

[[end.popup]]
type = "box"
orientation = "vertical"

[[end.popup.widgets]]
type = "label"
name = "header"
label = "Power menu"

[[end.popup.widgets]]
type = "box"
name = "buttons"

[[end.popup.widgets.widgets]]
type = "button"
class = "power-btn"
label = "<span>󰐥</span>"
on_click = "!shutdown now"

[[end.popup.widgets.widgets]]
type = "button"
class = "power-btn"
label = "<span>󰜉</span>"
on_click = "!reboot"

[[end]]
type = "tray"

[[end]]
type = "clock"

[[end]]
type = "notifications"

# ============================================================
# Dell AW3425DW OLED ultrawide (DP-1).
# This monitor alone auto-hides for burn-in protection.
# Reveal it by scrolling on the top-edge hotspot, not by hover.
# ============================================================
[monitors.DP-1]
position = "top"
icon_theme = "Adwaita"
autohide = 2000
autohide_listener = "scroll"

[[monitors.DP-1.start]]
type = "menu"
label = "󱓞"

[[monitors.DP-1.start]]
type = "workspaces"

[[monitors.DP-1.start]]
type = "launcher"
favorites = ["firefox"]

[monitors.DP-1.start.truncate]
mode = "end"
max_length = 30

[[monitors.DP-1.center]]
type = "music"
player_type = "mpris"

[[monitors.DP-1.end]]
type = "battery"
show_if = "ls /sys/class/power_supply/ | grep --quiet '^BAT'"

[[monitors.DP-1.end]]
type = "sys_info"
format = [
    "{cpu_percent}% ",
    "{memory_percent}% ",
]

[monitors.DP-1.end.interval]
cpu = 1

[[monitors.DP-1.end]]
type = "clipboard"
max_items = 5

[monitors.DP-1.end.truncate]
mode = "end"
length = 30

[[monitors.DP-1.end]]
type = "volume"

[[monitors.DP-1.end]]
type = "custom"
name = "power-menu"
class = "power-menu"

[[monitors.DP-1.end.bar]]
type = "button"
name = "power-btn"
label = ""
on_click = "popup:toggle"

[[monitors.DP-1.end.popup]]
type = "box"
orientation = "vertical"

[[monitors.DP-1.end.popup.widgets]]
type = "label"
name = "header"
label = "Power menu"

[[monitors.DP-1.end.popup.widgets]]
type = "box"
name = "buttons"

[[monitors.DP-1.end.popup.widgets.widgets]]
type = "button"
class = "power-btn"
label = "<span>󰐥</span>"
on_click = "!shutdown now"

[[monitors.DP-1.end.popup.widgets.widgets]]
type = "button"
class = "power-btn"
label = "<span>󰜉</span>"
on_click = "!reboot"

[[monitors.DP-1.end]]
type = "tray"

[[monitors.DP-1.end]]
type = "clock"

[[monitors.DP-1.end]]
type = "notifications"
