name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reject credentials and private operational identifiers
        run: python3 scripts/check-public-secrets.py

  flake:
    # Forks cannot receive the private cheesetool read token. The public-source
    # scan above still runs for every pull request; no self-hosted runner is used.
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: >-
          cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.NIX_ACCESS_TOKEN }}
      - name: Flake check (evaluation only)
        run: nix flake check --no-build
      - name: Cheap gates (preflight tests, runner tests, config evaluation)
        run: nix build -L --no-link .#checks.x86_64-linux.config-eval .#checks.x86_64-linux.preflight-tests .#checks.x86_64-linux.runner-tests
      - name: Evaluate the macOS runner configuration
        run: nix eval --raw .#darwinConfigurations.ci-mac.system.drvPath
